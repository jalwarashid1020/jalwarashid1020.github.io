<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jalwa Rashid — ML Engineer</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Syne:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050507;color:#fff;font-family:'Space Grotesk',sans-serif;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.container{max-width:1000px;margin:auto;padding:24px}
nav{display:flex;justify-content:space-between;align-items:center;padding:20px 0}
.logo{font-family:'Syne',sans-serif;font-weight:700;font-size:20px}
.nav-links{display:flex;gap:20px;color:#888;font-size:14px}
.hero{margin:90px 0 60px;text-align:center}
.badge{display:inline-block;border:1px solid #222;background:#111;padding:6px 14px;border-radius:30px;color:#aaa;font-size:13px;margin-bottom:20px}
.hero h1{font-family:'Syne',sans-serif;font-size:clamp(48px,9vw,92px);line-height:0.9;letter-spacing:-2px}
.hero h1 span{background:linear-gradient(90deg,#fff,#888);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:#777;margin:20px auto;max-width:520px;line-height:1.6;font-size:16px}
.btns{margin-top:30px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{padding:14px 28px;border-radius:100px;font-weight:700;font-size:15px;border:1px solid #222;transition:.3s}
.btn-white{background:#fff;color:#000}
.btn-dark{background:#111;color:#fff}
.btn:hover{transform:translateY(-2px)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:40px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
.card{background:#0F0F10;border:1px solid #1A1A1E;border-radius:20px;padding:28px}
.card h3{font-size:18px;margin-bottom:10px}
.card p{color:#777;font-size:14px;line-height:1.6}
.tag{display:inline-block;background:#1A1A1E;border:1px solid #252529;padding:5px 10px;border-radius:20px;font-size:12px;margin:4px;color:#aaa}
.projects{display:grid;grid-template-columns:1fr;gap:16px;margin-top:20px}
.project{padding:24px;border-radius:18px;background:linear-gradient(180deg,#141417,#0F0F10);border:1px solid #1E1E22;display:flex;justify-content:space-between;align-items:center}
.project b{font-size:18px}
.project span{color:#666;font-size:13px}
.footer{margin:80px 0 30px;text-align:center;color:#444;font-size:13px}
</style>
</head>
<body>
<div class="container">
<nav>
<div class="logo
